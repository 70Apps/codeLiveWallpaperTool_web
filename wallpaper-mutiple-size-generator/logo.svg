<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#gradient-bg)" opacity="0.12"/>
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="gradient-bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="gradient-main" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  
  <!-- iPhone (Tall) - Left -->
  <rect x="20" y="30" width="20" height="60" rx="3" fill="url(#gradient-main)" opacity="0.9">
    <animate attributeName="opacity" values="0.7;0.9;0.7" dur="3s" repeatCount="indefinite"/>
  </rect>
  <rect x="22" y="32" width="16" height="56" rx="2" fill="#0a0a0a"/>
  <line x1="26" y1="84" x2="34" y2="84" stroke="url(#gradient-main)" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- iPad (Square-ish) - Center Bottom -->
  <rect x="48" y="50" width="36" height="48" rx="3" fill="url(#gradient-main)" opacity="0.85">
    <animate attributeName="opacity" values="0.65;0.85;0.65" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="50" y="52" width="32" height="44" rx="2" fill="#0a0a0a"/>
  <circle cx="66" cy="93" r="1.5" fill="url(#gradient-main)"/>
  
  <!-- MacBook (Wide) - Top Right -->
  <rect x="52" y="18" width="48" height="28" rx="2" fill="url(#gradient-main)" opacity="0.8">
    <animate attributeName="opacity" values="0.6;0.8;0.6" dur="3s" begin="1s" repeatCount="indefinite"/>
  </rect>
  <rect x="54" y="20" width="44" height="24" rx="1.5" fill="#0a0a0a"/>
  <line x1="60" y1="46" x2="92" y2="46" stroke="url(#gradient-main)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Apple Watch (Small Square) - Right -->
  <rect x="88" y="55" width="24" height="28" rx="6" fill="url(#gradient-main)" opacity="0.75">
    <animate attributeName="opacity" values="0.55;0.75;0.55" dur="3s" begin="1.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="90" y="57" width="20" height="24" rx="5" fill="#0a0a0a"/>
  <circle cx="100" cy="79" r="1" fill="url(#gradient-main)"/>
  
  <!-- Connection Lines -->
  <path d="M 40 60 Q 50 55 66 50" stroke="url(#gradient-main)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4">
    <animate attributeName="stroke-dashoffset" from="0" to="12" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M 66 50 Q 70 40 76 32" stroke="url(#gradient-main)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4">
    <animate attributeName="stroke-dashoffset" from="0" to="12" dur="2s" begin="0.3s" repeatCount="indefinite"/>
  </path>
  <path d="M 84 66 Q 88 66 100 69" stroke="url(#gradient-main)" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.4">
    <animate attributeName="stroke-dashoffset" from="0" to="12" dur="2s" begin="0.6s" repeatCount="indefinite"/>
  </path>
  
  <!-- Center Icon - Image/Wallpaper Symbol -->
  <g transform="translate(54, 54)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="none" stroke="#a78bfa" stroke-width="1.5"/>
    <circle cx="4" cy="4" r="1.5" fill="#a78bfa"/>
    <path d="M 2 10 L 5 7 L 8 9 L 10 6" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Glow Effect -->
  <circle cx="60" cy="60" r="58" fill="none" stroke="url(#gradient-main)" stroke-width="0.5" opacity="0.2">
    <animate attributeName="r" values="58;62;58" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
