<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="#8b5cf6" opacity="0.2"/>

  <!-- Main "B" Letter -->
  <g transform="translate(40, 30)">
    <path d="M 20 0 L 0 0 L 0 40 L 20 40 C 30 40 30 20 20 20 L 10 20 L 10 0 Z" fill="#a78bfa"/>
    <path d="M 20 20 C 30 20 30 40 20 40 L 20 60 L 0 60 L 0 40 L 10 40 L 10 20 Z" fill="#a78bfa"/>
  </g>

  <!-- Glow Effect -->
  <circle cx="60" cy="60" r="58" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="58;62;58" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
