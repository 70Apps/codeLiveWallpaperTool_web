<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#gradient-bg)" opacity="0.12"/>
  
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="gradient-bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="gradient-main" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gradient-cyan" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>
  
  <!-- Video Player Icon (Left) -->
  <g transform="translate(15, 35)">
    <rect x="0" y="0" width="36" height="28" rx="3" fill="url(#gradient-main)" opacity="0.9">
      <animate attributeName="opacity" values="0.7;0.9;0.7" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="2" y="2" width="32" height="24" rx="2" fill="#0a0a0a"/>
    <!-- Play button -->
    <polygon points="14,10 14,18 22,14" fill="url(#gradient-main)">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </polygon>
    <!-- Progress bar -->
    <rect x="6" y="22" width="24" height="2" rx="1" fill="rgba(139,92,246,0.3)"/>
    <rect x="6" y="22" width="12" height="2" rx="1" fill="url(#gradient-main)">
      <animate attributeName="width" values="0;24;0" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Arrow Flow (Center) -->
  <g transform="translate(55, 49)">
    <path d="M 0 0 L 10 0" stroke="url(#gradient-main)" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.5">
      <animate attributeName="stroke-dashoffset" from="0" to="8" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Film Strip Frames (Center-Right) -->
  <g transform="translate(68, 30)">
    <!-- Frame 1 -->
    <rect x="0" y="0" width="14" height="18" rx="1.5" fill="url(#gradient-cyan)" opacity="0.8">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <rect x="1" y="1" width="12" height="16" rx="1" fill="#0a0a0a"/>
    <rect x="0" y="3" width="14" height="1" fill="url(#gradient-cyan)" opacity="0.3"/>
    <rect x="0" y="14" width="14" height="1" fill="url(#gradient-cyan)" opacity="0.3"/>
    
    <!-- Frame 2 -->
    <rect x="16" y="0" width="14" height="18" rx="1.5" fill="url(#gradient-main)" opacity="0.8">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="17" y="1" width="12" height="16" rx="1" fill="#0a0a0a"/>
    <rect x="16" y="3" width="14" height="1" fill="url(#gradient-main)" opacity="0.3"/>
    <rect x="16" y="14" width="14" height="1" fill="url(#gradient-main)" opacity="0.3"/>
    
    <!-- Frame 3 -->
    <rect x="8" y="22" width="14" height="18" rx="1.5" fill="url(#gradient-main)" opacity="0.8">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="9" y="23" width="12" height="16" rx="1" fill="#0a0a0a"/>
    <rect x="8" y="25" width="14" height="1" fill="url(#gradient-main)" opacity="0.3"/>
    <rect x="8" y="36" width="14" height="1" fill="url(#gradient-main)" opacity="0.3"/>
  </g>
  
  <!-- Arrow to Wallpaper -->
  <g transform="translate(55, 71)">
    <path d="M 0 0 L 10 0" stroke="url(#gradient-main)" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.5">
      <animate attributeName="stroke-dashoffset" from="0" to="8" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Wallpaper/Device Icon (Bottom Right) -->
  <g transform="translate(70, 75)">
    <rect x="0" y="0" width="24" height="18" rx="2" fill="url(#gradient-main)" opacity="0.9">
      <animate attributeName="opacity" values="0.7;0.9;0.7" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="1.5" y="1.5" width="21" height="15" rx="1.5" fill="#0a0a0a"/>
    <!-- Wallpaper image icon -->
    <circle cx="7" cy="7" r="1.5" fill="#a78bfa"/>
    <path d="M 5 13 L 8 10 L 11 12 L 14 9 L 17 11" stroke="#a78bfa" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Device notch -->
    <rect x="10" y="0" width="4" height="1" rx="0.5" fill="#0a0a0a"/>
  </g>
  
  <!-- Sparkles/Magic Effect -->
  <g opacity="0.6">
    <circle cx="52" cy="35" r="1.5" fill="#a78bfa">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="65" cy="55" r="1" fill="#06b6d4">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="95" cy="70" r="1.5" fill="#a78bfa">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="50" cy="85" r="1" fill="#06b6d4">
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Scissors Icon (Cutting symbol) -->
  <g transform="translate(40, 45)" opacity="0.7">
    <circle cx="0" cy="0" r="2" fill="none" stroke="#06b6d4" stroke-width="1">
      <animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="6" r="2" fill="none" stroke="#06b6d4" stroke-width="1">
      <animate attributeName="r" values="2;3;2" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <line x1="0" y1="0" x2="4" y2="3" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="6" x2="4" y2="3" stroke="#06b6d4" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Glow Effect -->
  <circle cx="60" cy="60" r="58" fill="none" stroke="url(#gradient-main)" stroke-width="0.5" opacity="0.2">
    <animate attributeName="r" values="58;62;58" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.4;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
