<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视频截取壁纸生成器 - Video Cut Wallpaper Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📹 视频截取壁纸生成器</h1>
            <p class="subtitle">从视频中提取精彩画面，生成完美壁纸</p>
        </header>

        <main>
            <!-- 上传区域 -->
            <section class="upload-section" id="uploadSection">
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon">🎬</div>
                    <h2>选择或拖放视频文件</h2>
                    <p>支持 MP4, MOV, AVI, WEBM 等格式</p>
                    <input type="file" id="videoInput" accept="video/*" hidden>
                    <button class="btn-primary" onclick="document.getElementById('videoInput').click()">
                        选择视频文件
                    </button>
                </div>
            </section>

            <!-- 视频预览和控制区域 -->
            <section class="video-section" id="videoSection" style="display: none;">
                <div class="video-container">
                    <video id="videoPlayer" controls></video>
                </div>

                <div class="controls-panel">
                    <div class="control-group">
                        <label for="frameCount">截取份数：</label>
                        <input type="number" id="frameCount" value="10" min="2" max="50">
                        <span class="control-hint">将视频等分为多少份</span>
                    </div>

                    <button class="btn-primary" id="extractBtn">
                        🎯 开始截取画面
                    </button>

                    <button class="btn-secondary" id="changeVideoBtn">
                        🔄 更换视频
                    </button>
                </div>

                <div class="progress-bar" id="progressBar" style="display: none;">
                    <div class="progress-fill" id="progressFill"></div>
                    <span class="progress-text" id="progressText">0%</span>
                </div>
            </section>

            <!-- 截图网格 -->
            <section class="frames-section" id="framesSection" style="display: none;">
                <h2>选择画面</h2>
                <p class="section-hint">点击画面选择，然后导出为壁纸</p>
                <div class="frames-grid" id="framesGrid"></div>
            </section>

            <!-- 导出设置 -->
            <section class="export-section" id="exportSection" style="display: none;">
                <h2>导出设置</h2>
                
                <div class="export-panel">
                    <div class="selected-frame">
                        <h3>已选择画面</h3>
                        <canvas id="selectedCanvas"></canvas>
                    </div>

                    <div class="export-options">
                        <div class="option-group">
                            <h3>设备尺寸</h3>
                            <div class="device-grid">
                                <label class="device-option">
                                    <input type="radio" name="device" value="iphone-15-pro-max" checked>
                                    <span>iPhone 15 Pro Max</span>
                                    <small>1290×2796</small>
                                </label>
                                <label class="device-option">
                                    <input type="radio" name="device" value="iphone-15-pro">
                                    <span>iPhone 15 Pro</span>
                                    <small>1179×2556</small>
                                </label>
                                <label class="device-option">
                                    <input type="radio" name="device" value="iphone-15">
                                    <span>iPhone 15</span>
                                    <small>1179×2556</small>
                                </label>
                                <label class="device-option">
                                    <input type="radio" name="device" value="iphone-se">
                                    <span>iPhone SE</span>
                                    <small>750×1334</small>
                                </label>
                                <label class="device-option">
                                    <input type="radio" name="device" value="ipad-pro-13">
                                    <span>iPad Pro 13"</span>
                                    <small>2064×2752</small>
                                </label>
                                <label class="device-option">
                                    <input type="radio" name="device" value="ipad-pro-11">
                                    <span>iPad Pro 11"</span>
                                    <small>1668×2388</small>
                                </label>
                                <label class="device-option">
                                    <input type="radio" name="device" value="ipad-air">
                                    <span>iPad Air</span>
                                    <small>1640×2360</small>
                                </label>
                                <label class="device-option">
                                    <input type="radio" name="device" value="macbook-pro-16">
                                    <span>MacBook Pro 16"</span>
                                    <small>3456×2234</small>
                                </label>
                                <label class="device-option">
                                    <input type="radio" name="device" value="macbook-pro-14">
                                    <span>MacBook Pro 14"</span>
                                    <small>3024×1964</small>
                                </label>
                                <label class="device-option">
                                    <input type="radio" name="device" value="macbook-air">
                                    <span>MacBook Air</span>
                                    <small>2560×1664</small>
                                </label>
                                <label class="device-option">
                                    <input type="radio" name="device" value="apple-watch-ultra">
                                    <span>Apple Watch Ultra</span>
                                    <small>410×502</small>
                                </label>
                                <label class="device-option">
                                    <input type="radio" name="device" value="apple-watch-series-9">
                                    <span>Apple Watch S9</span>
                                    <small>396×484</small>
                                </label>
                            </div>
                        </div>

                        <div class="option-group">
                            <h3>图片格式</h3>
                            <div class="format-options">
                                <label class="format-option">
                                    <input type="radio" name="format" value="png" checked>
                                    <span>PNG</span>
                                    <small>无损压缩，质量最佳</small>
                                </label>
                                <label class="format-option">
                                    <input type="radio" name="format" value="jpeg">
                                    <span>JPEG</span>
                                    <small>有损压缩，文件较小</small>
                                </label>
                                <label class="format-option">
                                    <input type="radio" name="format" value="webp">
                                    <span>WEBP</span>
                                    <small>现代格式，平衡质量与大小</small>
                                </label>
                            </div>
                        </div>

                        <div class="option-group" id="qualityGroup" style="display: none;">
                            <label for="quality">图片质量：<span id="qualityValue">90</span>%</label>
                            <input type="range" id="quality" min="1" max="100" value="90">
                        </div>

                        <button class="btn-export" id="exportBtn">
                            💾 导出壁纸
                        </button>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>支持的视频格式：MP4, MOV, AVI, WEBM | 最佳效果请使用高清视频</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
