<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="120" height="120" fill="#1A1035"/>
  <circle cx="60" cy="60" r="55" fill="url(#grad)"/>
  <defs>
    <radialGradient id="grad" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0%" stop-color="#2B1A4C" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#1A1035" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1A1035" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Device Mockup (Vertical Phone) -->
  <g transform="translate(35, 15)">
    <rect x="0" y="0" width="50" height="90" rx="8" stroke="#A87DFF" stroke-width="2">
      <animate attributeName="stroke-width" values="2;2.5;2" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="5" y="5" width="40" height="80" rx="6" stroke="#A87DFF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8"/>
  </g>

  <!-- Glow Effect -->
  <g transform="translate(35, 15)">
    <rect x="0" y="0" width="50" height="90" rx="8" stroke="#A87DFF" stroke-width="1" fill="none" opacity="0.3">
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-width" values="1;2;1" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Sparkles -->
  <g opacity="0.6">
    <circle cx="30" cy="30" r="1.5" fill="#A87DFF">
      <animate attributeName="r" values="1.5;2;1.5" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="90" cy="90" r="1" fill="#A87DFF">
      <animate attributeName="r" values="1;1.5;1" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
