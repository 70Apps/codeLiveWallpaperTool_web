<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- 深紫色圆形背景 -->
  <circle cx="100" cy="100" r="90" fill="#1A1035" opacity="0.7"/>
  <!-- 手机设备轮廓 -->
  <rect x="55" y="45" width="90" height="110" rx="12" ry="12" 
        fill="none" stroke="#A87DFF" stroke-width="3" 
        stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
  <!-- 壁纸图片符号 -->
  <rect x="75" y="65" width="50" height="70" rx="4" ry="4" 
        fill="none" stroke="#A87DFF" stroke-width="3" 
        stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
  <!-- 图片图标简化线框 -->
  <path d="M85 80 L95 90 L105 85 L115 95 L105 105 L90 95 Z" 
        fill="none" stroke="#A87DFF" stroke-width="2" 
        stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
  <!-- 生成/刷新符号 -->
  <path d="M130 130 Q140 135 135 145 Q130 150 125 145" 
        fill="none" stroke="#A87DFF" stroke-width="3" 
        stroke-linecap="round" filter="url(#neonGlow)"/>
  <!-- 设备底部小圆点 -->
  <circle cx="100" cy="145" r="3" fill="#A87DFF" filter="url(#neonGlow)"/>
</svg>