<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="120" height="120" fill="url(#gradient-bg)"/>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="gradient-bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="gradient-main" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Main Icon -->
  <g transform="translate(30, 30)">
    <rect x="0" y="0" width="60" height="60" rx="8" fill="url(#gradient-main)" opacity="0.9"/>
    <path d="M 10 30 L 30 10 L 50 30 L 30 50 Z" fill="#ffffff" opacity="0.7"/>
  </g>

  <!-- Gradient Palette -->
  <g transform="translate(80, 40)">
    <circle cx="0" cy="0" r="10" fill="#a78bfa"/>
    <circle cx="8" cy="8" r="10" fill="#8b5cf6" opacity="0.8"/>
    <circle cx="-8" cy="8" r="10" fill="#c4b5fd" opacity="0.6"/>
  </g>

  <!-- Dynamic Effects -->
  <circle cx="60" cy="60" r="40" fill="none" stroke="url(#gradient-main)" stroke-width="2" opacity="0.4">
    <animate attributeName="r" values="40;45;40" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.6;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Sparkles -->
  <g opacity="0.6">
    <circle cx="40" cy="80" r="2" fill="#ffffff">
      <animate attributeName="r" values="2;3;2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="30" r="1.5" fill="#ffffff">
      <animate attributeName="r" values="1.5;2;1.5" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
